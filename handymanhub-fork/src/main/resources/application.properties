spring.application.name=handymanhub-backend

# --- Database connection ---
# Point this at your own Postgres instance. These are just placeholders.
spring.datasource.url=jdbc:postgresql://localhost:5432/handymanhub
spring.datasource.username=postgres
spring.datasource.password=postgres

# --- JPA / Hibernate ---
# "validate" means: don't let Hibernate auto-create tables.
# Flyway migrations are the ONLY source of truth for the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
